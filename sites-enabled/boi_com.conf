<VirtualHost *:80>
    ServerName icomply.novajii.com

    # Proxy requests to localhost:8070
    ProxyPass / http://localhost:8077/
    ProxyPassReverse / http://localhost:8077/

    # Optional: Logging (for debugging)
    ErrorLog ${APACHE_LOG_DIR}/boi_com_error.log
    CustomLog ${APACHE_LOG_DIR}/boi_com_access.log combined
</VirtualHost>
