# Virtual Host for HTTP (port 80)
<VirtualHost *:80>
    # Define the document root where your website's files are located
    DocumentRoot /var/www/html/gopher_website

    # Primary domain and alias for the website
    ServerName gopherwoodschool.com.ng
    ServerAlias www.gopherwoodschool.com.ng

    # Redirect all HTTP traffic to HTTPS for security
    Redirect permanent / https://gopherwoodschool.com.ng/

    # Directory-level configuration for the website
    <Directory "/var/www/html/gopher_website">
        Options Indexes FollowSymLinks MultiViews ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # Optional: Logging (for debugging)
    ErrorLog ${APACHE_LOG_DIR}/gopherwoodschool_error.log
    CustomLog ${APACHE_LOG_DIR}/gopherwoodschool_access.log combined
</VirtualHost>

# Virtual Host for HTTPS (port 443)
<VirtualHost *:443>
    # Define the document root where your website's files are located
    DocumentRoot /var/www/html/gopher_website

    # Primary domain and alias for the website
    ServerName gopherwoodschool.com.ng
    ServerAlias www.gopherwoodschool.com.ng

    # Enable SSL for this VirtualHost
    SSLEngine on

    # Specify the SSL/TLS protocol settings for security
    SSLProtocol All -SSLv2 -SSLv3

    # Path to the SSL certificate file
    # SSLCertificateFile /home/jonathan/ssl/gopherwoodschool_com_ng/gopherwoodschool_com_ng1.crt
    SSLCertificateFile /home/jonathan/ssl/gopherwoodschool_com_ng/gopherwoodschool_com_ng.crt

    # Path to the SSL private key file
    # SSLCertificateKeyFile /home/jonathan/ssl/gopherwoodschool_com_ng/private1.key
    SSLCertificateKeyFile /home/jonathan/ssl/gopherwoodschool_com_ng/private.key

    # Path to the SSL certificate chain file (intermediate certificates)
    SSLCertificateChainFile /home/jonathan/ssl/gopherwoodschool_com_ng/gopherwoodschool_com_ng.ca

    # Optional: To enhance security and prevent downgrade attacks, include strong SSL/TLS cipher suites
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!RC4:!DH:!EDH
    SSLHonorCipherOrder on

    # Enable HTTP Strict Transport Security (HSTS) to enforce HTTPS connections
    # Recommended for all HTTPS websites. This ensures that browsers know to always connect over HTTPS.
    # The 'max-age' value determines how long the browser should remember this site as HTTPS-only.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Directory-level configuration for the website
    <Directory "/var/www/html/gopher_website">
        Options Indexes FollowSymLinks MultiViews ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>


