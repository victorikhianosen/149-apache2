<VirtualHost *:80>
DocumentRoot /var/www/html/novajii.com
ServerName notification.novajii.com
ServerAlias  backend.novajii.com
#ErrorLog /tmp/ore_error_log
#CustomLog /tmp/ore_access_log common

#switch on ssl and force al www to non-www

#Redirect / https://novajii.com/

##RewriteEngine On
##RewriteCond %{HTTPS} off
##RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}
##RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
##RewriteRule ^(.*)$ https://%1/$1 [R=301,L]

<Directory "/var/www/html/novajii.com">
Options Indexes FollowSymLinks MultiViews ExecCGI
AllowOverride All
Order allow,deny
Allow from all
</Directory>

</VirtualHost>
