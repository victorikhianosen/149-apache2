<VirtualHost *:80>
DocumentRoot /var/www/html
ServerName archsolveltd.com
ServerAlias  www.archsolveltd.com

#switch on ssl and force al www to non-www

#Redirect / https://archsolveltd.com/

<Directory "/var/www/html/archsolveltd.com"> 
