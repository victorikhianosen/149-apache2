<VirtualHost *:80>
    DocumentRoot /var/www/staging_glovtex_com
    ServerName staging.glovtex.com
    # ServerAlias www.glovtex.com

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory "/var/www/staging_glovtex_com">
        Options FollowSymLinks
        AllowOverride Limit Options FileInfo
        DirectoryIndex index.php
        Require all granted
    </Directory>

    <Directory /srv/www/staging_glovtex_com/wp-content>
        Options FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/staging_glovtex_com
    ServerName staging.glovtex.com
    ServerAlias www.staging.glovtex.com

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    SSLEngine on
    # SSLProtocol all
    # SSLProtocol All -SSLv2 -SSLv3

    SSLCertificateFile /home/jonathan/ssl/staging_glovtex_com/staging_glovtex_com.crt
    SSLCertificateKeyFile /home/jonathan/ssl/staging_glovtex_com/private.key
    SSLCertificateChainFile /home/jonathan/ssl/staging_glovtex_com/staging_glovtex_com.ca-bundle

    <Directory "/var/www/staging_glovtex_com">
        Options Indexes FollowSymLinks MultiViews ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
