<VirtualHost *:443>
DocumentRoot /var/www/html/magpora.com
ServerName magpora.com
ServerAlias  www.magpora.com
#ErrorLog /var/www/html/ore/error_log
#CustomLog /var/www/html/ore/access_log common

SSLEngine on
#SSLProtocol all

SSLProtocol All -SSLv2 -SSLv3
## Replace the files with newly generated SSL certificate files and reload apache server
SSLCertificateFile /home/jonathan/ssl/magpora_com/magpora_com.crt
SSLCertificateKeyFile /home/jonathan/ssl/magpora_com/private.key
# SSLCACertificateFile /home/jonathan/ssl/magpora_com/USERTrust_RSA_Certification_Authority.crt
# very important else you get curl errors
# SSLCertificateChainFile /home/jonathan/ssl/magpora_com/magpora_com.ca
SSLCertificateChainFile /home/jonathan/ssl/magpora_com/magpora_com.ca-bundle


<Directory "/var/www/html/magpora.com"> 
Options Indexes FollowSymLinks MultiViews ExecCGI 
AllowOverride All 
Order allow,deny 
Allow from all 
</Directory>

</VirtualHost>

<VirtualHost *:80>
DocumentRoot /var/www/html/magpora.com
ServerName magpora.com
ServerAlias  www.magpora.com

#switch on ssl and force al www to non-www

Redirect / https://magpora.com/

<Directory "/var/www/html/magpora.com"> 
Options Indexes FollowSymLinks MultiViews ExecCGI 
AllowOverride All 
Order allow,deny 
Allow from all 
</Directory>

</VirtualHost>
