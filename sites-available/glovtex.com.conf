<VirtualHost *:80>
DocumentRoot /var/www/html/glovtex.com
ServerName glovtex.com
ServerAlias  www.glovtex.com

#switch on ssl and force al www to non-www

# Redirect / https://glovtex.com/
ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined

<Directory "/var/www/html/glovtex.com"> 
Options Indexes FollowSymLinks MultiViews ExecCGI 
AllowOverride All 
Order allow,deny 
Allow from all 
</Directory>

</VirtualHost>

<VirtualHost *:443>
DocumentRoot /var/www/html/glovtex.com
ServerName glovtex.com
ServerAlias  www.glovtex.com

ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined

SSLEngine on
SSLProtocol all
SSLProtocol All -SSLv2 -SSLv3
# SSLCertificateFile /home/jonathan/ssl/glovtex_com/glovtex_com.crt
# SSLCertificateKeyFile /home/jonathan/ssl/glovtex_com/private.key
# SSLCertificateKeyFile /home/jonathan/ssl/glovtex_com/glovtex_com.ca-bundle
# SSLCACertificateFile /home/jonathan/ssl/glovtex_com/USERTrust_RSA_Certification_Authority.crt
# SSLCertificateChainFile /home/jonathan/ssl/glovtex_com/glovtex_com.ca


SSLCertificateFile /home/jonathan/ssl/glovtex_com/glovtex_com.crt
SSLCertificateKeyFile /home/jonathan/ssl/glovtex_com/private.key
SSLCertificateKeyFile /home/jonathan/ssl/glovtex_com/glovtex_com.ca-bundle
# SSLCACertificateFile /home/jonathan/ssl/glovtex_com/USERTrust_RSA_Certification_Authority.crt
# SSLCertificateChainFile /home/jonathan/ssl/glovtex_com/glovtex_com.ca

<Directory "/var/www/html/glovtex.com">
Options Indexes FollowSymLinks MultiViews ExecCGI
AllowOverride All
Order allow,deny
Allow from all
</Directory>

</VirtualHost>
