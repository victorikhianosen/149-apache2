<VirtualHost *:80>
        # The ServerName directive sets the request scheme, hostname and port that
        # the server uses to identify itself. This is used when creating
        # redirection URLs. In the context of virtual hosts, the ServerName
        # specifies what hostname must appear in the request's Host: header to
        # match this virtual host. For the default virtual host (this file) this
        # value is not decisive as it is used as a last resort host regardless.
        # However, you must set it for any further virtual host explicitly.
        ServerName ebusiness.magpora.com
	ServerAlias www.ebusiness.magpora.com
        #ServerAdmin webmaster@localhost
        #DocumentRoot /var/www/ebusiness_magpora_com
        #Redirect / https://ebusiness.magpora.com/
        # Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
        # error, crit, alert, emerg.
        # It is also possible to configure the loglevel for particular
        # modules, e.g.
        #LogLevel info ssl:warn

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        # For most configuration files from conf-available/, which are
        # enabled or disabled at a global level, it is possible to
        # include a line for only one particular virtual host. For example the
        # following line enables the CGI configuration for this host only
        # after it has been globally disabled with "a2disconf".
        #Include conf-available/serve-cgi-bin.conf
</VirtualHost>

<VirtualHost _default_:443>
        ServerName ebusiness.magpora.com
        ServerAdmin admin@magpora.com

        #DocumentRoot /var/www/ebusiness_magpora.com

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        SSLEngine on

        # SSLCertificateFile      /var/local/ssl/ebusiness_magpora_com/ebusiness_magpora_com.crt
        # SSLCertificateKeyFile /var/local/ssl/ebusiness_magpora_com/private.key
	# SSLCertificateKeyFile /var/local/ssl/ebusiness_magpora_com/ebusiness_magpora_com.ca-bundle
        # SSLCertificateChainFile /var/local/ssl/ebusiness_magpora_com/ebusiness_magpora_com.ca

        SSLCertificateFile      /var/local/ssl/ebusiness_magpora_com/ebusiness_magpora_com.crt
        SSLCertificateKeyFile   /var/local/ssl/ebusiness_magpora_com/private.key
        SSLCertificateChainFile /var/local/ssl/ebusiness_magpora_com/ebusiness_magpora_com.ca-bundle

        ProxyPreserveHost On
        ProxyPass /longpolling/        http://localhost:10070/longpolling/ retry=0
        ProxyPassReverse /longpolling/ http://localhost:10070/longpolling/ retry=0
        ProxyPass /                    http://localhost:10077/ retry=0
        ProxyPassReverse /            http://localhost:10077/ retry=0
	<Location /web/database/selector>
	      Redirect /web/database/selector /web/login?db=magpora_db
	      Order Allow,Deny
	      Allow from  all
	      #Allow from 192.168.1.0/24
	</Location>

	<Location /web/database/manager>
	    Order Allow,Deny
	    Deny from  all
	    #Allow from 192.168.1.0/24
	</Location>

</VirtualHost>