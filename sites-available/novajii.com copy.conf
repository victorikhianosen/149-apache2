<VirtualHost *:443>
DocumentRoot /var/www/html/wp
ServerName novajii.com
ServerAlias  www.novajii.com
#ErrorLog /var/www/html/ore/error_log
#CustomLog /var/www/html/ore/access_log common

SSLProxyEngine on
# Proxy Pass 
#ProxyPreserveHost On
Header always set X-Frame-Options SAMEORIGIN
               
RequestHeader unset Origin
 <Proxy balancer://ords>
  #BalancerMember https://ojtb8cju7x9rtms-db202105060700.adb.uk-london-1.oraclecloudapps.com/ords/
  BalancerMember https://ojtb8cju7x9rtms-ajdb1.adb.uk-london-1.oraclecloudapps.com/ords/
 </Proxy>

 ProxyPass /ords/ http://149.202.56.228:5000/ords/
 ProxyPassReverse /ords/ http://149.202.56.228:5000/ords/

 ProxyPass /i/ http://149.202.56.228:5000/i/
 ProxyPassReverse /i/ http://149.202.56.228:5000/i/
 
 ProxyPass /api2/ http://149.202.56.228:8200/web/public/
 ProxyPassReverse /api2/ http://149.202.56.228:8200/web/public/


 <Proxy balancer://sendsms>
 
  BalancerMember http://149.202.56.228:8200/web/public/sms/send
  ProxySet lbmethod=bytraffic
 </Proxy>
 ProxyPass /sendsms balancer://sendsms/
 ProxyPassReverse /sendsms balancer://sendsms/

  <Proxy balancer://sendBulk>
  BalancerMember http://149.202.56.228:8200/web/public/sms/sendBulk
  ProxySet lbmethod=bytraffic
 </Proxy>
 ProxyPass /sendBulk balancer://sendBulk/
 ProxyPassReverse /sendBulk balancer://sendBulk/


Alias /phpmyadmin  /usr/share/phpmyadmin/
Alias /phpmyadmin/ /usr/share/phpmyadmin/
<Directory "/usr/share/phpmyadmin">
Options Indexes FollowSymLinks MultiViews ExecCGI
AllowOverride All
Order allow,deny
Allow from all
</Directory>

Alias /web  /var/www/html/novajii.com/web/
Alias /web/  /var/www/html/novajii.com/web/
<Directory  /var/www/html/novajii.com/web>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

Alias /novaji_webhooks  /var/www/html/novajii.com/novaji_webhooks/
Alias /novaji_webhooks/  /var/www/html/novajii.com/novaji_webhooks/
<Directory  /var/www/html/novajii.com/novaji_webhooks>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

Alias /novaji-sms  /var/www/html/novajii.com/novaji-sms/
Alias /novaji-sms/  /var/www/html/novajii.com/novaji-sms/
<Directory  /var/www/html/novajii.com/novaji-sms>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

Alias /api  /var/www/html/novajii.com/api/public/
Alias /api/  /var/www/html/novajii.com/api/public/
<Directory  /var/www/html/novajii.com/api/public/>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>


Alias /bvn  /var/www/html/novajii.com/bvn/
Alias /bvn/  /var/www/html/novajii.com/bvn/
<Directory  /var/www/html/novajii.com/bvn>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>



SSLEngine on
#SSLProtocol all
SSLProtocol All -SSLv2 -SSLv3
SSLCertificateFile /home/jonathan/ssl/novajii_com/novajii_com.crt
SSLCertificateKeyFile /home/jonathan/ssl/novajii_com/private.key
SSLCertificateChainFile /home/jonathan/ssl/novajii_com/novajii_com.ca-bundle

<Directory "/var/www/html/wp"> 
Options Indexes FollowSymLinks MultiViews ExecCGI 
AllowOverride All 
Order allow,deny 
Allow from all 
</Directory>

</VirtualHost>

<VirtualHost *:80>
DocumentRoot /var/www/html/wp
ServerName novajii.com
ServerAlias  www.novajii.com

Redirect / https://novajii.com/

<Directory "/var/www/html/wp"> 
Options Indexes FollowSymLinks MultiViews ExecCGI 
AllowOverride All 
Order allow,deny 
Allow from all 
</Directory>

</VirtualHost>
