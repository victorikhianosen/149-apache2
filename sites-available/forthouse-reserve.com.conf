<VirtualHost *:80>

	ServerAdmin admin@forthouse-reserve.com
	ServerName forthouse-reserve.com
	ServerAlias www.forthouse-reserve.com
	DocumentRoot /var/www/html/fort
        Redirect / https://forthouse-reserve.com/
	<Directory /var/www/html/fort>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Order allow,deny
		Allow from all
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>

<VirtualHost *:443>
DocumentRoot /var/www/html/fort
ServerName forthouse-reserve.com
ServerAlias  www.forthouse-reserve.com

ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined

SSLEngine on
SSLProtocol all
SSLProtocol All -SSLv2 -SSLv3
SSLCertificateFile /home/jonathan/ssl/forthouse-reserve_com/forthouse-reserve_com.crt
SSLCertificateKeyFile /home/jonathan/ssl/forthouse-reserve_com/private.key
SSLCertificateKeyFile /home/jonathan/ssl/forthouse-reserve_com/forthouse-reserve_com.ca-bundle

<Directory "/var/www/html/fort">
Options Indexes FollowSymLinks MultiViews ExecCGI
AllowOverride All
Order allow,deny
Allow from all
</Directory>

</VirtualHost>
